name: Test iOS Build

on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false

      - name: Build iOS XCFramework
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache :shared:assembleSharedReleaseXCFramework --parallel --build-cache
