name: Release APK and Desktop Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (optional, defaults to event tag)"
        required: false
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/android
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/android/app-release.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false

      - name: Build Android release APK
        working-directory: app
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          chmod +x ./gradlew
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -f "android/app-release.jks" ]; then
            export RELEASE_KEYSTORE_PATH="app-release.jks"
          fi
          ./gradlew :android:assembleRelease --parallel --build-cache --scan

      - name: Locate and prepare APK asset
        run: |
          VERSION=$(node -e "console.log(require('../backend/package.json').version)")
          mkdir -p apk-artifacts
          APK_FILE=$(find android/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "apk-artifacts/com.iiitnr.inventoryapp-${VERSION}.apk"
          else
            echo "No APK found, copying standard output if exists"
          fi
        working-directory: app

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-release-apk
          path: app/apk-artifacts/*.apk
          retention-days: 1

  build-windows-installers:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false

      - name: Ensure Gradle cache directories exist
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle\caches" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle\wrapper" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle\daemon" | Out-Null

      - name: Build Desktop installers (EXE + MSI)
        working-directory: app
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_DESKTOP_REDIRECT_URI: ${{ secrets.GOOGLE_DESKTOP_REDIRECT_URI }}
        run: |
          .\gradlew.bat :desktop:packageExe :desktop:packageMsi -PbuildInstallers=true --parallel --build-cache

      - name: Locate and copy EXE + MSI
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          $exe = Get-ChildItem -Path app\desktop\build\compose -Recurse -Filter "*.exe" -ErrorAction Stop | Select-Object -First 1
          $msi = Get-ChildItem -Path app\desktop\build\compose -Recurse -Filter "*.msi" -ErrorAction Stop | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "$env:GITHUB_WORKSPACE\IIITNR-Inventory-App.exe"
          Copy-Item $msi.FullName -Destination "$env:GITHUB_WORKSPACE\IIITNR-Inventory-App.msi"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-release-exe
          path: IIITNR-Inventory-App.exe
          retention-days: 1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-release-msi
          path: IIITNR-Inventory-App.msi
          retention-days: 1

  build-linux-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false

      - name: Build Desktop app-image (Linux)
        working-directory: app
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
          GOOGLE_DESKTOP_REDIRECT_URI: ${{ secrets.GOOGLE_DESKTOP_REDIRECT_URI }}
        run: |
          chmod +x ./gradlew
          ./gradlew :desktop:packageDistributionForCurrentOS --parallel --build-cache

      - name: Install ImageMagick and libfuse2 (for AppImage)
        run: sudo apt-get update && sudo apt-get install -y imagemagick libfuse2

      - name: Prepare AppDir for AppImage
        run: |
          APP_SRC="app/desktop/build/compose/binaries/main/app/IIITNR Inventory App"
          APPDIR="$RUNNER_TEMP/AppDir"
          mkdir -p "$APPDIR"
          cp -a "$APP_SRC"/* "$APPDIR/"
          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          SELF="$(readlink -f "$0")"
          DIR="$(dirname "$SELF")"
          export _JAVA_AWT_WM_NONREPARENTING=1
          exec "$DIR/bin/IIITNR Inventory App" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/iiitnr-inventory-app.desktop" << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=IIITNR Inventory App
          Exec=AppRun
          Icon=iiitnr-inventory-app
          Categories=Utility;
          DESKTOP
          if [ -f "app/android/src/main/ic_launcher-playstore.png" ]; then
            cp "app/android/src/main/ic_launcher-playstore.png" "$APPDIR/iiitnr-inventory-app.png"
          elif [ -f "app/desktop/icon.png" ]; then
            cp "app/desktop/icon.png" "$APPDIR/iiitnr-inventory-app.png"
          else
            convert -size 256x256 xc:'#1976D2' "$APPDIR/iiitnr-inventory-app.png"
          fi
          echo "APPDIR=$APPDIR" >> $GITHUB_ENV

      - name: Download appimagetool
        run: |
          curl -sL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        run: |
          ./appimagetool.AppImage "$APPDIR" IIITNR-Inventory-App.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-appimage-release
          path: IIITNR-Inventory-App.AppImage
          retention-days: 1

  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false

      - name: Build iOS XCFramework
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache :shared:assembleSharedReleaseXCFramework --parallel --build-cache

      - name: Zip iOS XCFramework
        run: |
          mkdir -p ios-artifacts
          cd app/shared/build/XCFrameworks/release
          zip -r ../../../../../ios-artifacts/IIITNR-Inventory-App-iOS-shared.xcframework.zip shared.xcframework

      - name: Upload iOS XCFramework artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ios-release-xcframework
          path: ios-artifacts/IIITNR-Inventory-App-iOS-shared.xcframework.zip
          retention-days: 1

  upload-release:
    needs: [build-android, build-windows-installers, build-linux-appimage, build-ios]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts

      - name: Determine tag name
        id: tag
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_NAME="${INPUT_TAG_NAME:-${RELEASE_TAG_NAME:-$REF_NAME}}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG_NAME"

      - name: Upload release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          files: |
            artifacts/android-release-apk/*.apk
            artifacts/desktop-release-exe/IIITNR-Inventory-App.exe
            artifacts/desktop-release-msi/IIITNR-Inventory-App.msi
            artifacts/linux-appimage-release/IIITNR-Inventory-App.AppImage
            artifacts/ios-release-xcframework/IIITNR-Inventory-App-iOS-shared.xcframework.zip
          fail_on_unmatched_files: false
          preserve_order: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
