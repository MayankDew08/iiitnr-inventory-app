services:
  caddy:
    image: docker.io/caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - /srv/web:/srv/web:ro
      - ./logs/caddy:/var/log/caddy
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/iiitnr_inventory
    expose:
      - '4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/bun
        - -e
        - "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 15s
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app

  db:
    image: docker.io/postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: iiitnr_inventory
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  caddy_data:
  caddy_config:
  db_data:

networks:
  app:
    driver: bridge